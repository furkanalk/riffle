name: Lock File Sync

on:
  schedule:
    - cron: "0 9 * * 1"   # Her Pazartesi 09:00 UTC
  workflow_dispatch:        # Manuel tetikleme

jobs:
  sync:
    name: Sync package-lock.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update lock file
        run: npm install --package-lock-only

      - name: Open PR if lock file changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync package-lock.json"
          branch: chore/lockfile-sync
          delete-branch: true
          title: "chore: sync package-lock.json"
          body: |
            Automated lock file sync.

            Transitive dependency versions drifted from the committed
            `package-lock.json`. This PR updates the lock file so `npm ci`
            continues to pass in CI.

            > Triggered by the weekly lock file sync workflow.
          labels: dependencies
