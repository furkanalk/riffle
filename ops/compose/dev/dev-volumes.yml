# ==========================================================
# DEV OVERRIDE: Source bind mount for core-api hot-reload
#
# Merged on top of services.yml when ENV=dev.
# tsx watch picks up host file changes without rebuilding.
#
# The anonymous /app/node_modules volume keeps node_modules from the image
# instead of the (often empty) host folder. If deps are missing after a
# package.json change, rebuild the image or remove this service's volumes
# (`docker compose down -v` for the stack) so the volume repopulates.
# The core-api dev image also runs `npm install` on start when a module is missing.
# ==========================================================

services:
  core-api:
    volumes:
      - ../../../apps/core-api:/app
      - /app/node_modules
