# ==========================================================
# DEV OVERRIDE: Source bind mount for core-api hot-reload
#
# Merged on top of services.yml when ENV=dev.
# tsx watch picks up host file changes without rebuilding.
#
# The anonymous /app/node_modules volume ensures the
# container's installed modules are not overwritten.
# ==========================================================

services:
  core-api:
    volumes:
      - ../../../apps/core-api:/app
      - /app/node_modules
