# ==========================================================
# LAYER: APP
# Client (Vite Frontend)
# dev  → vite dev server on :5173 (HMR)
# prod → static build served on :80 (served by caddy upstream)
# ==========================================================

networks:
  riffle_network:

services:
  client:
    build:
      context: ../../../apps/client
      dockerfile: dockerfile
      target: ${DOCKER_STAGE:-dev}
    container_name: riffle-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
      # Used by vite.config.js server.proxy — must be the Docker service name when running in Docker.
      # Falls back to localhost when Vite is run directly on the host.
      API_PROXY_TARGET: http://core-api:${PORT:-1968}
    networks:
      - riffle_network
